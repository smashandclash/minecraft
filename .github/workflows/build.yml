name: build
on: [pull_request, push]

jobs:
  java:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: java } }
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with: { java-version: '25', distribution: 'microsoft' }
      - run: chmod +x ./gradlew && ./gradlew build
      - uses: actions/upload-artifact@v7
        with: { name: smashandclash-minecraft-jar, path: java/build/libs/ }
  bedrock:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: bedrock } }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - run: npm ci && node tools/build.mjs
      - uses: actions/upload-artifact@v7
        with: { name: smashandclash-mcaddon, path: bedrock/dist/ }
